<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniClick microphone</title>
  <style>
    body { font: 15px/1.5 Roboto, Arial, sans-serif; max-width: 460px; margin: 60px auto; padding: 0 16px; color: #202124; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #e8eaed; background: #202124; } }
    button { padding: 8px 16px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font: 500 14px Roboto, Arial, sans-serif; cursor: pointer; }
    #msg { margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Microphone for OmniClick</h1>
  <p>The tab recorder can add your voice to the video. Chrome needs your permission once.</p>
  <button id="allow" type="button">Allow microphone</button>
  <p id="msg" role="status"></p>
  <script src="mic.js"></script>
</body>
</html>
