<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniClick</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>OmniClick</h1>
  <ul id="features"></ul>
  <section id="rec" hidden>
    <h2>Tab recorder</h2>
    <label class="opt"><input type="checkbox" id="optAudio"> Record tab audio</label>
    <label class="opt"><input type="checkbox" id="optPointer"> Show cursor and clicks</label>
    <label class="opt"><input type="checkbox" id="optKeys"> Show typed keys (passwords are masked)</label>
    <label class="opt"><input type="checkbox" id="optMic"> Narrate with microphone</label>
    <label class="opt"><input type="checkbox" id="optAllSites"> Keep overlay after moving to other sites (asks for all-sites access)</label>
    <button id="recBtn" type="button">Start recording</button>
    <button id="pauseBtn" type="button" hidden>Pause</button>
    <div id="recStatus" class="hint" role="status"></div>
    <a id="openRecs" href="#">Open recordings</a>
    <div class="hint">Shortcut: Alt+Shift+R to start or stop (change it at chrome://extensions/shortcuts).</div>
  </section>
  <button id="manage-notes" type="button">Search / back up notes</button>
  <button id="drive-settings" type="button">Google Drive sync</button>
  <p class="hint">Changes apply immediately to open tabs.</p>
  <p class="hint"><a href="https://wisecrunch.github.io/OmniClick/" target="_blank" rel="noopener">Home</a> · <a href="https://wisecrunch.github.io/OmniClick/privacy.html" target="_blank" rel="noopener">Privacy</a> · <a href="https://wisecrunch.github.io/OmniClick/terms.html" target="_blank" rel="noopener">Terms</a></p>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
